events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx/minio_cache levels=1:2 keys_zone=minio_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_cache minio_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;

            proxy_pass http://minio:9000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Location to handle cache purging
        location ~ /purge(/.*) {
            allow 127.0.0.1;
            deny all;

            proxy_cache_purge minio_cache $1;

            # Return success for purge request
            return 200 "Purged cache for $1\n";
        }
    }
}